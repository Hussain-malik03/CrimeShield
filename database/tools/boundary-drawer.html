            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Handle shape creation
        map.on(L.Draw.Event.CREATED, function (event) {
            const layer = event.layer;
            drawnItems.addLayer(layer);

            let coordinates = '';

            // For Polygon and Rectangle
            if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                let latlngs = layer.getLatLngs()[0];
                const first = latlngs[0];
                const last = latlngs[latlngs.length - 1];

                // Close the polygon if not already closed
                if (first.lat !== last.lat || first.lng !== last.lng) {
                    latlngs.push(first);
                }

                coordinates = latlngs.map(latlng =>
                    `(${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)})`
                ).join('\n');
            }

            // For Circle: Approximate as polygon
            else if (layer instanceof L.Circle) {
                const center = layer.getLatLng();
                const radius = layer.getRadius();
                const points = 64;
                const latlngs = [];

                for (let i = 0; i < points; i++) {
                    const angle = (i * 360 / points) * (Math.PI / 180);
                    const dx = radius * Math.cos(angle);
                    const dy = radius * Math.sin(angle);
                    const newLatLng = L.latLng(
                        center.lat + (180 / Math.PI) * (dy / 6378137),
                        center.lng + (180 / Math.PI) * (dx / 6378137) / Math.cos(center.lat * Math.PI / 180)
                    );
                    latlngs.push(newLatLng);
                }

                // Close circle approximation
                latlngs.push(latlngs[0]);

                coordinates = latlngs.map(latlng =>
                    `(${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)})`
                ).join('\n');
            }

            output.textContent = "Coordinates:\n" + coordinates;
        });
    </script>
</body>
</html>
